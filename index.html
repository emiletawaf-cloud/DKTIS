<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DKTIS Building Bills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow ledger column; editor inputs on top, the residents' statement below it. Meter-panel feel: stone neutrals, deep teal accent, ochre for amounts owed. */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#E3E8E5; --line:#CBD3CE;
  --ink:#16201C; --muted:#5A6862; --accent:#0E6B58; --accent-ink:#FFFFFF;
  --owe:#A4600B; --owe-bg:#F6EBD8; --credit:#0E6B58; --credit-bg:#DCEEE8; --danger:#A33A2B;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211E; --sunk:#0D1210; --line:#2C3833;
  --ink:#E4ECE8; --muted:#94A39C; --accent:#3FB79A; --accent-ink:#06120E;
  --owe:#E2A447; --owe-bg:#33270F; --credit:#4CC5A6; --credit-bg:#11302A; --danger:#E07A69; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211E; --sunk:#0D1210; --line:#2C3833;
  --ink:#E4ECE8; --muted:#94A39C; --accent:#3FB79A; --accent-ink:#06120E;
  --owe:#E2A447; --owe-bg:#33270F; --credit:#4CC5A6; --credit-bg:#11302A; --danger:#E07A69; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
h3{font-size:15px;font-weight:600}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=number]{font-family:var(--f-mono);text-align:right}
textarea{width:100%;min-height:64px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;font-weight:500}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 8px}
button.ghost:hover{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.live{background:var(--credit-bg);color:var(--credit)}
.pill.warn{background:var(--owe-bg);color:var(--owe)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
.field label b{color:var(--ink);font-weight:600}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;gap:8px;align-items:center;padding:10px;border-radius:8px;background:var(--sunk)}
.row.exp{grid-template-columns:minmax(120px,2fr) minmax(90px,1fr) minmax(110px,1fr) auto}
.row.adj{grid-template-columns:minmax(100px,1fr) minmax(120px,1.2fr) minmax(90px,1fr) minmax(120px,2fr) auto}
.row .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.empty{font-size:13.5px;color:var(--muted);padding:6px 2px}
details.settings summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:17px}
details.settings[open] summary{margin-bottom:12px}
/* statement */
.stmt{display:flex;flex-direction:column;gap:14px}
.bills{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.bills span b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.note{background:var(--sunk);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.apt{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.apt > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 16px}
.apt > summary::-webkit-details-marker{display:none}
.apt .name{font-family:var(--f-display);font-weight:600;font-size:18px}
.apt .meta{font-size:12.5px;color:var(--muted)}
.apt .due{text-align:right}
.apt .due .amt{font-family:var(--f-mono);font-size:20px;font-weight:500}
.apt.owe .due .amt{color:var(--owe)}
.apt.credit .due .amt{color:var(--credit)}
.apt .due .tag{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.apt.owe{border-left:4px solid var(--owe)}
.apt.credit{border-left:4px solid var(--credit)}
.apt.zero{border-left:4px solid var(--line)}
.lines{border-top:1px solid var(--line);padding:10px 16px 14px;display:flex;flex-direction:column}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.ln .d{font-size:12px;color:var(--muted);grid-column:1/2}
.ln .v{font-family:var(--f-mono);text-align:right}
.ln.minus .v{color:var(--credit)}
.ln.tot{font-weight:600;border-bottom:0;border-top:1px solid var(--ink);margin-top:4px;padding-top:8px}
.ln.sec{border-bottom:0;padding:10px 0 2px}
.ln.sec .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.apt-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:20}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
.ov,.det{display:flex;flex-direction:column;gap:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);border-left:5px solid var(--line);background:var(--surface);font-weight:400}
.card.owe{border-left-color:var(--owe)} .card.credit{border-left-color:var(--credit)}
.card:hover{border-color:var(--accent)} .card.owe:hover{border-left-color:var(--owe)} .card.credit:hover{border-left-color:var(--credit)}
.cname{font-family:var(--f-display);font-weight:600;font-size:18px}
.ctag{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted);align-self:center;text-align:right}
.camt{grid-column:1/-1;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:500}
.card.owe .camt{color:var(--owe)} .card.credit .camt{color:var(--credit)}
.cmeta{font-size:12.5px;color:var(--muted)} .cgo{font-size:12.5px;color:var(--accent);font-weight:600;text-align:right}
.back{align-self:flex-start;background:transparent;border-color:transparent;padding:4px 0;color:var(--accent);font-weight:600}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:3px solid var(--line)}
.dhead.owe{border-bottom-color:var(--owe)} .dhead.credit{border-bottom-color:var(--credit)}
.dhead h2{font-size:26px}
.dhead .due{text-align:right} .dhead .tag{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.dhead .amt{font-family:var(--f-mono);font-size:26px;font-weight:500} .dhead.owe .amt{color:var(--owe)} .dhead.credit .amt{color:var(--credit)}
.det .lines{border-top:0;padding:0}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding-top:12px}
.hush{background:transparent;border:0;color:var(--line);padding:2px 8px;font-size:16px;line-height:1}
.hush:hover{color:var(--muted)}
.pay{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-top:16px;padding:16px;border-radius:var(--r);background:var(--owe-bg)}
.paytxt{flex:1 1 220px;min-width:0}
.payamt{font-family:var(--f-mono);font-size:24px;font-weight:500;color:var(--owe)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;font-weight:500}
a.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.payqr{margin:0;text-align:center;font-size:11.5px;color:var(--muted)}
.payqr img{width:120px;height:120px;display:block;border-radius:6px;background:#fff;padding:4px}
.mpick{display:flex;flex-direction:column;gap:4px}
.mlabel{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mswitch{display:flex;align-items:stretch;border:1.5px solid var(--accent);border-radius:12px;background:var(--surface);overflow:hidden}
.mswitch button{border:0;border-radius:0;background:transparent;color:var(--accent);font-size:20px;line-height:1;padding:8px 16px;font-weight:600}
.mswitch button:hover:not(:disabled){background:var(--credit-bg)}
.mswitch button:disabled{color:var(--line);opacity:1}
.mswitch select{border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:18px;padding:8px 12px;text-align:center;text-align-last:center;cursor:pointer;min-width:0;flex:1}
.sthead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sthead h2{font-size:26px}
.stsum{text-align:right}.stdue{font-family:var(--f-mono);font-size:22px;color:var(--owe)}
.acc{display:flex;flex-direction:column;gap:10px}
.ac{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;transition:box-shadow .15s}
.ac.open{box-shadow:0 6px 24px rgba(0,0,0,.08);border-color:var(--accent)}
.ach{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;padding:14px 16px}
.ach:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:14px}
.ach:hover{background:var(--bg)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;background:var(--sunk);color:var(--muted)}
.ac.owe .av{background:var(--owe-bg);color:var(--owe)} .ac.credit .av{background:var(--credit-bg);color:var(--credit)}
.acn{display:flex;flex-direction:column;min-width:0}
.nm{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--ink)}
.mt{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acs{display:flex;flex-direction:column;align-items:flex-end}
.tg{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.am{font-family:var(--f-mono);font-size:19px;font-weight:500;color:var(--ink)}
.ac.owe .am,.ac.owe .tg{color:var(--owe)} .ac.credit .am,.ac.credit .tg{color:var(--credit)}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px}
.ac.open .chev{transform:rotate(-135deg);margin:4px 4px 0}
.acb{padding:4px 16px 16px;border-top:1px solid var(--line)}
.acb .lines{border-top:0;padding:6px 0 0}
@media (max-width:480px){.ach{gap:10px;padding:12px}.av{width:34px;height:34px;font-size:15px}.nm{font-size:16.5px}.am{font-size:16.5px}.mt{white-space:normal}}
@media (max-width:620px){
  .mpick{width:100%} header.top .bar{width:100%}
  .row.exp,.row.adj{grid-template-columns:1fr 1fr}
  .row.exp > :first-child,.row.adj > :nth-child(4){grid-column:1/-1}
  h1{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0}
</style>
</head><body>

<div class="wrap">
  <header class="top">

  </header>
  <main id="app" class="stmt"><div class="notice">Loading the building statements…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

/* ---------- local storage (this browser, this computer) ---------- */
const KEY="dktis-bills-v1", BKEY="dktis-bills-lastbackup";
const db=true, isEditor=true;
const downloads={save:async({filename,data})=>{
  const blob=new Blob([data],{type:filename.endsWith(".json")?"application/json":filename.endsWith(".pdf")?"application/pdf":"text/html"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return {status:"saved"}}};
let remoteAt=0, draftAt=0, remoteOk=false;
function store(at){try{localStorage.setItem(KEY,JSON.stringify({settings:cfg,months,savedAt:at}))}catch(e){toast("Couldn't keep your changes in this browser. Download data.json now.")}}
function persist(){draftAt=Date.now();store(draftAt);const p=$("#syncPill");if(p){p.className="pill warn";p.textContent=ghOn()?"Not saved yet":"Changes not uploaded yet"}}
/* ---------- GitHub save ---------- */
const GH_KEY="dktis-github";
function ghCfg(){let g={};try{g=JSON.parse(localStorage.getItem(GH_KEY)||"{}")}catch(e){}
  const h=location.hostname, seg=location.pathname.split("/").filter(Boolean)[0]||"";
  if(!g.owner&&/\.github\.io$/.test(h))g.owner=h.split(".")[0];
  if(!g.repo&&/\.github\.io$/.test(h)&&seg&&!/\.html$/.test(seg))g.repo=seg;
  g.branch=g.branch||"main";return g}
const ghOn=()=>{const g=ghCfg();return !!(g.token&&g.owner&&g.repo)};
const b64e=str=>btoa(unescape(encodeURIComponent(str))), b64d=b=>decodeURIComponent(escape(atob(b.replace(/\s/g,""))));
async function ghReq(method,body){const g=ghCfg();
  const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/data.json${method==="GET"?"?ref="+encodeURIComponent(g.branch)+"&t="+Date.now():""}`,
    {method,cache:"no-store",headers:{Authorization:"Bearer "+g.token,Accept:"application/vnd.github+json"},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=new Error("GitHub "+r.status);e.status=r.status;throw e}
  return r.json()}
async function ghGet(){const j=await ghReq("GET");return {sha:j.sha,data:JSON.parse(b64d(j.content))}}
let ghBusy=false;
async function ghSave(reason){
  if(!ghOn()||ghBusy)return false;ghBusy=true;const p=$("#syncPill");if(p){p.className="pill";p.textContent="Saving…"}
  const at=Date.now();
  try{
    let sha=null;try{sha=(await ghGet()).sha}catch(e){if(e.status!==404)throw e}
    await ghReq("PUT",{message:(reason||"Update bills")+" ("+new Date(at).toLocaleString("en-GB")+")",content:b64e(JSON.stringify({settings:cfg,months,savedAt:at},null,2)),sha:sha||undefined,branch:ghCfg().branch});
    remoteAt=at;draftAt=at;remoteOk=true;store(at);ghBusy=false;
    const q=$("#syncPill");if(q){q.className="pill live";q.textContent="Saved to GitHub"}toast("Saved. The family link updates within a couple of minutes.");return true;
  }catch(e){ghBusy=false;const q=$("#syncPill");if(q){q.className="pill warn";q.textContent="Not saved yet"}
    toast(e.status===401||e.status===403?"GitHub refused the token. Check it in the Save to GitHub box.":e.status===404?"Repo not found. Check the owner and repo name.":"Couldn't reach GitHub. Try again.");return false}
}
function lastBackupText(){let t=null;try{t=+localStorage.getItem(BKEY)}catch(e){}
  if(!t) return {txt:"No backup file saved yet",old:true};
  const d=Math.floor((Date.now()-t)/86400000);return {txt:"Last backup file: "+(d<1?"today":d===1?"yesterday":d+" days ago"),old:d>30}}
let cfg=null,months={},cur=null,view="stmt",openApt=null;
let dirty=false,saving=false,saveTimer=null,lastSaved="";

/* ---------- calculation ---------- */
function emptyMonth(id){return {id,meters:{},gas:{},other:0,stairs:0,garage:0,elevator:cfg?cfg.elevatorDefault:550,shared:[],adjustments:[],note:""}}

function compute(m,opening){
  const A=cfg.apartments, n=A.length, col=cfg.collector;
  const S=r2(m.stairs), G=r2(m.garage), O=r2(m.other), E=r2(m.elevator), EX=r2(m.elevatorExtra);
  const T=r2(m.tamerOwn), ev=m.ev||{}, evK=r2(ev.kozman), evT=r2(ev.tawaf), evTot=r2(evK+evT);
  const tIn=cfg.tamerInStairs!==false;
  const sRest=r2(Math.max(0,S-(tIn?T:0))), gRest=r2(Math.max(0,G-evTot));
  const per={};
  A.forEach(a=>per[a.id]={id:a.id,name:a.name,meter:a.meter,collector:a.id===col,charges:[],credits:[],opening:r2(opening[a.id]||0)});
  const add=(id,label,amt,detail,cat,short)=>{if(Math.abs(r2(amt))>0.004)per[id].charges.push({label,amt:r2(amt),detail:detail||"",cat:cat||"other",short:short||label})};

    water:r2(WB+sh.filter(isWater).reduce((t,x)=>t+r2(x.amount),0)),

function openingFor(id){
  const ids=Object.keys(months).sort(); let bal={...(cfg.opening||{})};
  for(const mid of ids){

  }

}

const CATS=[["elec","Electricity"],["ev","Electric car charging"],["gas","Gas"],["elev","Elevator"],["water","Water"],["other","Others"]];
function grouped(r){

        doc.setFontSize(8.5);col(C.muted);doc.text("Then type the amount above.",M+5,y+39);
        try{doc.addImage(PAY_QR,"PNG",R-41,y+3,38,38)}catch(e){}
      }
    } else {doc.setFont("helvetica","bold");doc.setFontSize(13);col(C.ink);doc.text(T(r.name)+"'s own share",M,y);doc.text(fmt(r.chargeTotal)+" EGP",R,y,{align:"right"});}
    footer();
  });
  return doc.output("blob");
}

/* ---------- state changes ---------- */
function setPath(obj,path,val){const k=path.split(".");let o=obj;for(let i=0;i<k.length-1;i++){o[k[i]]=o[k[i]]||{};o=o[k[i]]}o[k[k.length-1]]=val}
function refreshPreview(){
  const lc=$("#liveCards"); if(!lc) return;
  lc.innerHTML=cardsHTML(compute(months[cur],openingFor(cur)));
}
function touch(full){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(saveMonth,600);if(full)render();else refreshPreview()}
async function saveMonth(){
  if(!cur||!months[cur]) return;
  if(saving){saveTimer=setTimeout(saveMonth,400);return}
  persist();dirty=false;
}
let cfgTimer=null;
function touchCfg(full){clearTimeout(cfgTimer);cfgTimer=setTimeout(persist,400);if(full){const open=$("#settings")?.open;render();if(open)$("#settings").open=true}else refreshPreview()}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="monthSel"||t.id==="pubSel") return;
  if(t.dataset.path){const v=t.type==="number"?r2(t.value):t.value;setPath(months[cur],t.dataset.path,v);touch(false)}
  else if(t.dataset.arr){const it=months[cur][t.dataset.arr][+t.dataset.i];it[t.dataset.k]=t.type==="checkbox"?t.checked:t.type==="number"?r2(t.value):t.value;touch(false)}
  else if(t.dataset.cfg){const v=t.type==="checkbox"?t.checked:t.type==="number"?r2(t.value):t.value;setPath(cfg,t.dataset.cfg,v);touchCfg(false)}
  else if(t.dataset.aptI!==undefined){cfg.apartments[+t.dataset.aptI][t.dataset.k]=t.value;touchCfg(false)}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="monthSel"){cur=t.value;render()}
  else if(t.tagName==="SELECT"&&(t.dataset.arr||t.dataset.cfg)) {/* handled by input */}
});
function stepMonth(d){const asc=Object.keys(months).sort(),k=asc.indexOf(cur),nk=k+d;if(nk<0||nk>=asc.length)return;cur=asc[nk];render()}
document.addEventListener("keydown",e=>{const tg=e.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT")return;if(e.key==="ArrowLeft")stepMonth(-1);else if(e.key==="ArrowRight")stepMonth(1)});
document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  const m=months[cur];
  if(t.dataset.view){const was=view;view=t.dataset.view;openApt=null;render();window.scrollTo(0,0);if(was==="edit"&&view==="stmt"&&ghOn()&&draftAt>remoteAt){clearTimeout(saveTimer);saveMonth();ghSave("Update bills")}return}
  if(t.id==="ghSaveBtn"){clearTimeout(saveTimer);saveMonth();ghSave("Update bills");return}
  if(t.id==="ghOff"){const g=ghCfg();delete g.token;try{localStorage.setItem(GH_KEY,JSON.stringify(g))}catch(err){}render();toast("Disconnected. The token was removed from this browser.");return}
  if(t.id==="ghConnect"){
    const g={owner:$("#gh_owner").value.trim(),repo:$("#gh_repo").value.trim(),token:$("#gh_token").value.trim(),branch:"main"};
    if(!g.owner||!g.repo||!g.token){toast("Fill in the username, repo and token");return}
    try{localStorage.setItem(GH_KEY,JSON.stringify(g))}catch(err){toast("This browser can't keep the token");return}
    t.disabled=true;t.textContent="Checking…";
    try{await ghGet();render();toast("Connected to GitHub");if(draftAt>remoteAt)ghSave("Update bills")}
    catch(err){try{localStorage.setItem(GH_KEY,JSON.stringify({owner:g.owner,repo:g.repo}))}catch(e2){}render();
      toast(err.status===401||err.status===403?"GitHub refused that token. Check it has Contents: Read and write on this repo.":err.status===404?"Couldn't find data.json in "+g.owner+"/"+g.repo+". Check the names.":"Couldn't reach GitHub. Try again.")}
    return}
  if(t.dataset.open){const id=t.dataset.open;if(view!=="stmt"){view="stmt";openApt=id}else openApt=openApt===id?null:id;render();
    const el=openApt&&document.getElementById("ac-"+openApt);if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"});return}
  if(t.dataset.back){openApt=null;render();return}
  if(t.dataset.step){stepMonth(+t.dataset.step);return}
  if(t.dataset.copy){const v=t.dataset.copy;try{await navigator.clipboard.writeText(v);toast("Copied "+v)}catch(err){toast(v)}return}
  if(t.id==="newMonth"){
    const ids=Object.keys(months).sort(); const now=new Date();
    const id=ids.length?nextMonthId(ids[ids.length-1]):now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    months[id]=emptyMonth(id);cur=id;touch(true);toast(monthLabel(id)+" added");
  }
  else if(t.id==="addExp"){m.shared=m.shared||[];m.shared.push({id:uid(),label:"",amount:0,paidBy:cfg.collector,split:[],private:false});touch(true);setTimeout(()=>{const ins=document.querySelectorAll('[data-arr="shared"][data-k="label"]');ins[ins.length-1]?.focus()},0)}
  else if(t.id==="addAdj"){m.adjustments=m.adjustments||[];m.adjustments.push({id:uid(),apt:"tamer",type:"payment",amount:0,note:""});touch(true)}
  else if(t.dataset.del){m[t.dataset.del].splice(+t.dataset.i,1);touch(true)}
  else if(t.dataset.split!==undefined){
    const x=m.shared[+t.dataset.split];const all=cfg.apartments.map(a=>a.id);let sp=x.split&&x.split.length?[...x.split]:[...all];
    sp=sp.includes(t.dataset.apt)?sp.filter(i=>i!==t.dataset.apt):[...sp,t.dataset.apt];
    if(!sp.length){toast("Pick at least one apartment");return}
    x.split=sp.length===all.length?[]:all.filter(i=>sp.includes(i));touch(true);
  }
  else if(t.dataset.paid){
    e.preventDefault();
    const a=cfg.apartments.find(x=>x.id===t.dataset.paid);
    m.adjustments=m.adjustments||[];m.adjustments.push({id:uid(),apt:a.id,type:"payment",amount:r2(+t.dataset.amt),note:"Paid "+monthLabel(cur)});
    touch(true);toast(a.name+" marked as paid");
    if(ghOn()){clearTimeout(saveTimer);saveMonth();ghSave("Mark "+a.name+" as paid for "+monthLabel(cur))}
  }
  else if(t.id==="delMonth"){
    if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="Click again to delete "+monthLabel(cur);setTimeout(()=>{if(t.isConnected){t.dataset.armed="";t.textContent="Delete this month"}},4000);return}
    const id=cur;
    delete months[id];persist();cur=Object.keys(months).sort().reverse()[0]||null;render();toast(monthLabel(id)+" deleted");
  }
  else if(t.id==="copyWa"){
    const txt=waText(compute(m,openingFor(cur)));
    try{await navigator.clipboard.writeText(txt);toast("Copied. Paste it in the building group.")}
    catch(err){const ta=document.createElement("textarea");ta.value=txt;ta.style.width="100%";t.closest(".panel").appendChild(ta);ta.select();toast("Select all and copy")}
  }
  else if(t.id==="dlHtml"){
    const s=compute(m,openingFor(cur));
    if(!window.jspdf){toast("PDF tool didn't load. Check your internet and reload.");return}
    let blob;try{blob=pdfStatement(s)}catch(err){console.error(err);toast("Couldn't build the PDF");return}
    try{await downloads.save({filename:"DKTIS-"+s.id+".pdf",data:blob})}catch(err){if(err.code!=="declined")toast("Download isn't available here")}
  }
  else if(t.id==="dlJson"){
    const at=Date.now();draftAt=at;store(at);
    await downloads.save({filename:"data.json",data:JSON.stringify({settings:cfg,months,savedAt:at},null,2)});
    toast("data.json saved to Downloads. Now upload it to GitHub.");
  }
  else if(t.id==="discard"){
    if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="Click again to discard";setTimeout(()=>{if(t.isConnected){t.dataset.armed="";t.textContent="Discard my changes"}},4000);return}
    try{localStorage.removeItem(KEY)}catch(e){}location.reload();
  }
  else if(t.id==="loadBackup"){$("#loadFile").click()}
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="loadFile"||!e.target.files[0]) return;
  try{
    const d=JSON.parse(await e.target.files[0].text());
    if(!d.settings||!d.months||!Array.isArray(d.settings.apartments)) throw 0;
    cfg=d.settings;months=d.months;cur=Object.keys(months).sort().reverse()[0]||null;persist();render();toast("Backup loaded");
  }catch(err){toast("That file isn't a DKTIS backup")}
});

/* ---------- boot ---------- */
async function boot(){
  let remote=null,draft=null;
  if(ghOn()){try{remote=(await ghGet()).data;remoteOk=true}catch(e){}}
  if(!remote){try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(r.ok){remote=await r.json();remoteOk=true}}catch(e){}}
  try{draft=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  remoteAt=remote&&remote.savedAt||0;
  if(draft&&draft.settings&&(!remote||(draft.savedAt||0)>remoteAt)){cfg=draft.settings;months=draft.months||{};draftAt=draft.savedAt||0}
  else if(remote&&remote.settings){cfg=remote.settings;months=remote.months||{};draftAt=remoteAt;store(remoteAt)}
  else{
